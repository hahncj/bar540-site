<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add a Bottle — Bar 540</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-32.png?v=2" sizes="32x32">
<link rel="icon" type="image/png" href="/icon-192.png?v=2" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d2330; --bg-deep:#171b25; --panel:#252c3c; --cream:#f5efe4; --cream-dim:#aab0c2;
    --coral:#ff7a52; --coral-deep:#e5623c; --teal:#3ecbb3; --gold:#f4b942; --line:rgba(245,239,228,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--cream); font-family:'Nunito',sans-serif;
    min-height:100vh; padding:32px 20px 80px;
  }
  .wrap{max-width:480px; margin:0 auto;}
  a.back{color:var(--cream-dim); font-size:13px; display:inline-block; margin-bottom:20px;}
  h1{font-family:'Fredoka',sans-serif; font-weight:600; font-size:28px; margin-bottom:6px;}
  .sub{color:var(--cream-dim); font-size:14px; margin-bottom:28px;}
  label{display:block; font-size:13px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color:var(--teal); margin:18px 0 6px;}
  input, select, textarea{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--cream);
    border-radius:10px; padding:12px 14px; font-size:15px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:70px;}
  .row{display:flex; gap:12px;}
  .row > div{flex:1; min-width:0;}
  .btn{
    display:block; width:100%; background:var(--coral); color:#fff; border:none;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px;
    padding:14px; border-radius:30px; margin-top:28px; cursor:pointer;
  }
  .btn:active{background:var(--coral-deep);}
  .btn-secondary{
    display:block; width:100%; background:transparent; color:var(--teal); border:1px solid var(--teal);
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px;
    padding:11px; border-radius:30px; margin-top:10px; cursor:pointer;
  }
  #scanner{width:100%; border-radius:10px; overflow:hidden; margin-top:10px; display:none;}
  #status{margin-top:16px; font-size:14px; text-align:center;}
  #status.ok{color:var(--teal);}
  #status.err{color:var(--coral);}
  #lookupStatus{font-size:13px; color:var(--cream-dim); margin-top:8px; text-align:center;}
  .photo-preview{
    display:none; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px; text-align:center;
  }
  .photo-preview img{max-width:100%; max-height:240px; border-radius:8px; display:block; margin:0 auto;}
  .photo-preview .caption{font-size:12px; color:var(--cream-dim); margin-top:8px;}
  .photo-actions{display:flex; gap:10px;}
  .photo-choices{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:10px 0;}
  .photo-choices:empty{display:none;}
  .photo-choice{
    position:relative; aspect-ratio:1; padding:0; overflow:hidden; cursor:pointer;
    border-radius:8px; border:2px solid var(--line); background:#fff;
  }
  .photo-choice img{width:100%; height:100%; object-fit:contain; display:block;}
  .photo-choice.own img{object-fit:cover;}
  .photo-choice.selected{border-color:var(--teal); box-shadow:0 0 0 2px var(--teal);}
  .photo-choice span{
    position:absolute; left:0; right:0; bottom:0; padding:2px 0;
    font-size:10px; font-weight:700; text-align:center; color:var(--cream); background:rgba(23,27,37,0.8);
  }
  .photo-actions .btn-secondary{flex:1;}
  .btn-ai{background:var(--teal); color:var(--bg-deep); border-color:var(--teal);}
  .btn-ai:disabled, .btn-secondary:disabled{opacity:0.6; cursor:default;}
  .ai-status{font-size:13px; color:var(--cream-dim); margin-top:6px;}
  .ai-status:empty{display:none;}
  .typeahead{position:relative;}
  .suggestions{
    position:absolute; z-index:5; left:0; right:0; top:calc(100% + 4px);
    background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
    box-shadow:0 12px 28px rgba(0,0,0,0.45);
  }
  .suggestion{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:none; border:none; border-top:1px solid var(--line);
    color:var(--cream); font:inherit; padding:9px 14px;
  }
  .suggestion:first-child{border-top:none;}
  .suggestion:hover, .suggestion.active{background:rgba(62,203,179,0.14);}
  .suggestion-name{font-size:15px; font-weight:600;}
  .suggestion-meta{font-size:12px; color:var(--cream-dim);}
  .suggestion-badge{float:right; margin-left:8px; font-size:11px; font-weight:700; color:var(--teal); white-space:nowrap;}
  .match-note{color:var(--teal);}
  .linkish{background:none; border:none; color:var(--teal); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; margin-top:8px; display:none;}
  .success-panel{
    text-align:center; background:var(--panel); border:2px solid var(--teal);
    border-radius:16px; padding:36px 24px; margin-top:20px; display:none;
  }
  .success-panel .check{
    width:56px; height:56px; border-radius:50%; background:var(--teal); color:var(--bg-deep);
    font-size:28px; font-weight:700; display:flex; align-items:center; justify-content:center;
    margin:0 auto 16px;
  }
  .success-panel h2{font-family:'Fredoka',sans-serif; font-weight:600; font-size:20px; margin-bottom:6px;}
  .success-panel p{color:var(--cream-dim); font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/#cellar">&larr; Back to the Cellar</a>
  <h1>Add a Bottle</h1>
  <div class="sub">Snap the label and let AI fill in the details, scan a barcode, or just type it in.</div>

  <button type="button" class="btn-secondary btn-ai" id="identifyBtn">&#128247; Snap the Label &mdash; AI Fills It In</button>
  <button type="button" class="btn-secondary" id="scanBtn">Scan Barcode</button>
  <div id="scanner"></div>
  <div id="lookupStatus"></div>

  <form id="bottleForm">
    <label>Category</label>
    <select name="category" id="categorySelect" required>
      <option value="">Choose one&hellip;</option>
      <option value="whiskey">Whiskey</option>
      <option value="wine">Wine</option>
      <option value="beer">Specialty Beer</option>
    </select>

    <label>Name</label>
    <div class="typeahead">
      <input type="text" name="name" required autocomplete="off" placeholder="Start typing &mdash; e.g. Woodford Reserve"
        role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
      <div class="suggestions" id="suggestions" role="listbox" hidden></div>
    </div>
    <input type="hidden" name="existing_id" id="existingId">
    <div class="ai-status match-note" id="matchNote"></div>
    <button type="button" class="linkish" id="fillFromNameBtn">&#10024; Fill in the rest from this name</button>
    <div class="ai-status" id="nameStatus"></div>

    <label>Maker / Distillery / Winery</label>
    <div class="typeahead">
      <input type="text" name="maker" autocomplete="off" placeholder="Start typing &mdash; e.g. Buffalo Trace"
        role="combobox" aria-autocomplete="list" aria-controls="makerSuggestions" aria-expanded="false">
      <div class="suggestions" id="makerSuggestions" role="listbox" hidden></div>
    </div>

    <div class="row">
      <div>
        <label>ABV %</label>
        <input type="number" step="0.1" name="abv" placeholder="45">
      </div>
      <div id="vintageField" hidden>
        <label>Vintage</label>
        <input type="number" name="vintage" min="1800" max="2100" step="1" placeholder="2019">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Quantity</label>
        <input type="number" name="quantity" min="1" step="1" value="1" required>
      </div>
      <div>
        <label>Purchased</label>
        <input type="date" name="purchased_on">
      </div>
    </div>

    <label>Notes</label>
    <textarea name="notes" placeholder="Tasting notes, where it's from, why it's here..."></textarea>

    <label>Photo</label>
    <div class="photo-preview" id="photoPreview">
      <img id="photoPreviewImg" alt="Bottle photo preview">
      <div class="caption" id="photoCaption"></div>
    </div>
    <div class="photo-choices" id="photoChoices"></div>
    <div class="photo-actions">
      <button type="button" class="btn-secondary" id="takePhotoBtn">Take Photo</button>
      <button type="button" class="btn-secondary" id="choosePhotoBtn">Choose Photo</button>
    </div>
    <button type="button" class="linkish" id="findStockBtn">&#128269; Find stock photos for this bottle</button>
    <div class="ai-status" id="stockStatus"></div>
    <input type="file" name="photo" id="photoInput" accept="image/*" hidden>

    <button type="submit" class="btn">Add to the Cellar</button>
  </form>

  <div id="status"></div>

  <div class="success-panel" id="successPanel">
    <div class="check">&#10003;</div>
    <h2>Added to the Cellar</h2>
    <p>Taking you back&hellip;</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // Admin-only page: bounce to sign-in if there's no session. (The API enforces this too.)
  fetch('/api/session').then(function(r){ return r.json(); }).then(function(s){
    if (!s.authed) location.replace('/login.html?next=' + encodeURIComponent('/add.html'));
  });

  var form = document.getElementById('bottleForm');
  var status = document.getElementById('status');
  var scanBtn = document.getElementById('scanBtn');
  var scannerDiv = document.getElementById('scanner');
  var lookupStatus = document.getElementById('lookupStatus');
  var html5QrCode;

  // Vintage only applies to wine; clear it when switching away so it isn't saved by accident.
  var vintageField = document.getElementById('vintageField');
  document.getElementById('categorySelect').addEventListener('change', function(){
    vintageField.hidden = this.value !== 'wine';
    if (vintageField.hidden) form.vintage.value = '';
  });

  // --- Photo: your own (camera/library) or a stock photo (barcode lookup or name search) — you pick ---
  var photoInput = document.getElementById('photoInput');
  var photoPreview = document.getElementById('photoPreview');
  var photoPreviewImg = document.getElementById('photoPreviewImg');
  var photoCaption = document.getElementById('photoCaption');
  var photoChoices = document.getElementById('photoChoices');
  var findStockBtn = document.getElementById('findStockBtn');
  var stockStatus = document.getElementById('stockStatus');
  var ownPhotoUrl = null;  // object URL for the photo you took or chose
  var stockUrls = [];      // stock images that actually load
  var photoChoice = null;  // 'own', a stock image URL, or null
  var savedPhotoUrl = null; // photo of the bottle picked from the type-ahead; kept unless you choose another

  function renderPhoto(){
    if (photoChoice) {
      var own = photoChoice === 'own';
      photoPreviewImg.src = own ? ownPhotoUrl : photoChoice;
      photoCaption.textContent = own ? 'Your photo' : 'Stock photo — a copy is saved with the bottle';
      photoPreview.style.display = 'block';
    } else if (savedPhotoUrl) {
      photoPreviewImg.src = savedPhotoUrl;
      photoCaption.textContent = 'Saved photo — kept unless you choose another';
      photoPreview.style.display = 'block';
    } else {
      photoPreview.style.display = 'none';
    }
    // Thumbnails only when there's a choice to make.
    photoChoices.textContent = '';
    if (!stockUrls.length) return;
    if (ownPhotoUrl) photoChoices.appendChild(choiceTile('own', ownPhotoUrl, 'Yours'));
    stockUrls.forEach(function(url){ photoChoices.appendChild(choiceTile(url, url, 'Stock')); });
  }

  function choiceTile(value, src, label){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'photo-choice' + (value === 'own' ? ' own' : '') + (photoChoice === value ? ' selected' : '');
    btn.dataset.choice = value;
    var img = document.createElement('img');
    img.alt = label + ' photo';
    img.src = src;
    var tag = document.createElement('span');
    tag.textContent = label;
    btn.appendChild(img);
    btn.appendChild(tag);
    return btn;
  }

  photoChoices.addEventListener('click', function(e){
    var tile = e.target.closest('.photo-choice');
    if (!tile) return;
    photoChoice = tile.dataset.choice;
    renderPhoto();
  });

  // Keep only candidates that actually load (retailer image links go stale).
  function addStockImages(urls){
    urls.forEach(function(url){
      if (stockUrls.indexOf(url) !== -1) return;
      var probe = new Image();
      probe.onload = function(){
        if (stockUrls.indexOf(url) !== -1 || stockUrls.length >= 8) return;
        stockUrls.push(url);
        if (!photoChoice) photoChoice = url;
        renderPhoto();
      };
      probe.src = url;
    });
  }

  // Forget stock photos from an earlier lookup (your own photo stays).
  function clearStockImages(){
    stockUrls = [];
    if (photoChoice !== 'own') photoChoice = ownPhotoUrl ? 'own' : null;
    renderPhoto();
  }

  function findStockPhotos(name){
    stockStatus.textContent = 'Looking for stock photos…';
    findStockBtn.disabled = true;
    fetch('/api/stock-photos?q=' + encodeURIComponent(name)).then(function(r){
      return r.json().then(function(data){ return { status: r.status, data: data }; });
    }).then(function(res){
      if (res.status === 401) { location.href = '/login.html?next=' + encodeURIComponent('/add.html'); return; }
      var images = (res.data && res.data.images) || [];
      if (res.data && res.data.error) stockStatus.textContent = res.data.error;
      else if (!images.length) stockStatus.textContent = 'No stock photos found for ' + name + '.';
      else { stockStatus.textContent = 'Tap a photo above to use it.'; addStockImages(images); }
    }).catch(function(){
      stockStatus.textContent = 'Stock photo search failed — try again.';
    }).then(function(){ findStockBtn.disabled = false; });
  }

  findStockBtn.addEventListener('click', function(){
    if (form.name.value.trim()) findStockPhotos(form.name.value.trim());
  });

  // The name-based links only make sense once there's a name to work with.
  function updateNameLinks(){
    var show = form.name.value.trim().length >= 3 ? 'inline-block' : 'none';
    findStockBtn.style.display = show;
    document.getElementById('fillFromNameBtn').style.display = show;
  }

  document.getElementById('takePhotoBtn').addEventListener('click', function(){
    photoInput.setAttribute('capture', 'environment');
    photoInput.click();
  });
  document.getElementById('choosePhotoBtn').addEventListener('click', function(){
    photoInput.removeAttribute('capture');
    photoInput.click();
  });

  photoInput.addEventListener('change', function(){
    var file = photoInput.files[0];
    if (!file) return;
    if (ownPhotoUrl) URL.revokeObjectURL(ownPhotoUrl);
    ownPhotoUrl = URL.createObjectURL(file);
    photoChoice = 'own';
    renderPhoto();
    if (identifyNextPhoto || !form.name.value.trim()) identifyFromPhoto(file);
    identifyNextPhoto = false;
  });

  // --- Type-ahead dropdowns (bottle name, maker) ---
  // fetchRows(q) resolves to rows; describe(row) gives { title, meta, badge }; onPick(row) fills the form.
  function attachTypeahead(input, listEl, fetchRows, describe, onPick){
    var rows = [];
    var active = -1;
    var timer = null;
    var seq = 0;

    function render(){
      listEl.textContent = '';
      rows.forEach(function(row, i){
        var d = describe(row);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'suggestion' + (i === active ? ' active' : '');
        btn.setAttribute('role', 'option');
        btn.dataset.index = i;
        if (d.badge) {
          var badge = document.createElement('span');
          badge.className = 'suggestion-badge';
          badge.textContent = d.badge;
          btn.appendChild(badge);
        }
        var title = document.createElement('div');
        title.className = 'suggestion-name';
        title.textContent = d.title;
        btn.appendChild(title);
        if (d.meta) {
          var meta = document.createElement('div');
          meta.className = 'suggestion-meta';
          meta.textContent = d.meta;
          btn.appendChild(meta);
        }
        listEl.appendChild(btn);
      });
      listEl.hidden = !rows.length;
      input.setAttribute('aria-expanded', String(!listEl.hidden));
    }

    function hide(){ rows = []; render(); }
    function pick(row){ hide(); onPick(row); }

    input.addEventListener('input', function(){
      clearTimeout(timer);
      var q = input.value.trim();
      if (q.length < 2) { hide(); return; }
      timer = setTimeout(function(){
        var mine = ++seq;
        fetchRows(q).then(function(result){
          if (mine !== seq) return; // a newer search has started
          rows = result || [];
          active = -1;
          render();
        }).catch(function(){});
      }, 200);
    });
    // mousedown (not click) so it lands before the input's blur hides the list.
    listEl.addEventListener('mousedown', function(e){
      var btn = e.target.closest('.suggestion');
      if (!btn) return;
      e.preventDefault();
      pick(rows[Number(btn.dataset.index)]);
    });
    input.addEventListener('blur', function(){ setTimeout(hide, 150); });
    input.addEventListener('keydown', function(e){
      if (listEl.hidden) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        var last = rows.length - 1;
        if (e.key === 'ArrowDown') active = active >= last ? 0 : active + 1;
        else active = active <= 0 ? last : active - 1;
        render();
      } else if (e.key === 'Enter' && active >= 0) {
        e.preventDefault();
        pick(rows[active]);
      } else if (e.key === 'Escape') {
        hide();
      }
    });
  }

  function getJson(url){
    return fetch(url).then(function(r){ return r.ok ? r.json() : []; });
  }

  var CATEGORY_LABELS = { whiskey: 'Whiskey', wine: 'Wine', beer: 'Specialty Beer' };
  var existingIdInput = document.getElementById('existingId');
  var matchNote = document.getElementById('matchNote');

  // Name: every bottle in the database (on hand, finished, and the starter catalog).
  form.name.addEventListener('input', function(){ unlinkPickedBottle(); }); // typing again means it's no longer the bottle you picked
  attachTypeahead(form.name, document.getElementById('suggestions'),
    function(q){ return getJson('/api/bottles/search?q=' + encodeURIComponent(q)); },
    function(b){
      return {
        title: b.name + (b.vintage ? ' ' + b.vintage : ''),
        meta: [CATEGORY_LABELS[b.category], b.maker, b.abv ? b.abv + '% ABV' : ''].filter(Boolean).join(' · '),
        badge: b.quantity > 0 ? b.quantity + ' on hand' : ''
      };
    },
    pickBottle);

  // Maker: makers already in the database, narrowed to the chosen category.
  attachTypeahead(form.maker, document.getElementById('makerSuggestions'),
    function(q){
      return getJson('/api/makers?q=' + encodeURIComponent(q) + (form.category.value ? '&category=' + form.category.value : ''));
    },
    function(m){ return { title: m.maker, meta: m.bottles === 1 ? '1 bottle' : m.bottles + ' bottles' }; },
    function(m){ form.maker.value = m.maker; });

  // Fill the form from the picked bottle and save onto that row instead of adding a duplicate.
  function pickBottle(b){
    form.category.value = b.category;
    form.category.dispatchEvent(new Event('change'));
    form.name.value = b.name;
    form.maker.value = b.maker || '';
    form.abv.value = b.abv === null || b.abv === undefined ? '' : b.abv;
    if (b.category === 'wine') form.vintage.value = b.vintage || '';
    form.notes.value = b.notes || '';
    existingIdInput.value = b.id;
    matchNote.textContent = b.quantity > 0
      ? 'You already have ' + b.quantity + ' — saving adds to that count.'
      : 'Already in the database — saving puts it back in the Cellar.';
    savedPhotoUrl = b.photo_url || null;
    renderPhoto();
    updateNameLinks();
    if (!savedPhotoUrl && !ownPhotoUrl && !stockUrls.length) findStockPhotos(b.name);
  }

  function unlinkPickedBottle(){
    if (!existingIdInput.value) return;
    existingIdInput.value = '';
    matchNote.textContent = '';
    savedPhotoUrl = null;
    renderPhoto();
  }

  // --- AI lookup: label photo and/or typed name -> form fields (POST /api/identify) ---
  var identifyBtn = document.getElementById('identifyBtn');
  var fillFromNameBtn = document.getElementById('fillFromNameBtn');
  var nameStatus = document.getElementById('nameStatus');
  var identifyNextPhoto = false;
  var identifying = false;

  identifyBtn.addEventListener('click', function(){
    identifyNextPhoto = true;
    photoInput.setAttribute('capture', 'environment');
    photoInput.click();
  });

  // Offer the name lookup once there's something worth looking up.
  form.name.addEventListener('input', updateNameLinks);
  fillFromNameBtn.addEventListener('click', function(){
    runIdentify(null, nameStatus);
  });

  // Shrink to ~1280px on the long edge as a JPEG: plenty to read a label, and keeps the AI call small and cheap.
  function resizeForAi(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error('resize failed')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('unreadable')); };
      img.src = url;
    });
  }

  function identifyFromPhoto(file){
    lookupStatus.textContent = 'Reading the label…';
    resizeForAi(file).then(function(blob){
      runIdentify(blob, lookupStatus);
    }, function(){
      lookupStatus.textContent = "Couldn't read that photo — try another, or fill in the details by hand.";
    });
  }

  // Fills only fields that are still empty, so nothing you typed gets overwritten.
  function fillFromAi(d){
    var filled = [];
    function set(field, value, label){
      if (value === null || value === undefined || value === '' || String(field.value).trim()) return;
      field.value = value;
      filled.push(label);
    }
    if (d.category && !form.category.value) {
      form.category.value = d.category;
      form.category.dispatchEvent(new Event('change'));
      filled.push('category');
    }
    set(form.name, d.name, 'name');
    set(form.maker, d.maker, 'maker');
    set(form.abv, d.abv, 'ABV');
    if (form.category.value === 'wine') set(form.vintage, d.vintage, 'vintage');
    set(form.notes, d.notes, 'tasting notes');
    return filled;
  }

  function runIdentify(photoBlob, statusEl){
    if (identifying) return;
    var body = new FormData();
    if (photoBlob) body.append('photo', photoBlob, 'label.jpg');
    if (form.name.value.trim()) body.append('name', form.name.value.trim());
    identifying = true;
    identifyBtn.disabled = fillFromNameBtn.disabled = true;
    statusEl.textContent = photoBlob ? 'Reading the label…' : 'Looking it up…';
    fetch('/api/identify', { method: 'POST', body: body }).then(function(r){
      return r.json().then(function(data){ return { ok: r.ok, status: r.status, data: data }; });
    }).then(function(res){
      if (res.status === 401) { location.href = '/login.html?next=' + encodeURIComponent('/add.html'); return; }
      if (!res.ok) { statusEl.textContent = (res.data && res.data.error) || 'AI lookup failed — fill in the details by hand.'; return; }
      var d = res.data;
      if (!d.name) { statusEl.textContent = "Couldn't tell what that is — fill in the details by hand."; return; }
      var filled = fillFromAi(d);
      updateNameLinks();
      findStockPhotos(d.name);
      statusEl.textContent = filled.length
        ? 'Filled in ' + filled.join(', ') + (d.confident ? '' : ' (a best guess — the label was hard to make out)') + '. Double-check before saving.'
        : 'Looks like ' + d.name + ' — your fields were already filled in, so nothing changed.';
    }).catch(function(){
      statusEl.textContent = 'AI lookup failed — check your connection and try again.';
    }).then(function(){
      identifying = false;
      identifyBtn.disabled = fillFromNameBtn.disabled = false;
    });
  }

  scanBtn.addEventListener('click', async function(){
    if (scannerDiv.style.display === 'block') {
      await stopScanner();
      return;
    }
    scannerDiv.style.display = 'block';
    scanBtn.textContent = 'Stop Scanning';
    lookupStatus.textContent = '';
    try {
      if (typeof Html5Qrcode === 'undefined') {
        throw new Error('Scanner library failed to load — check your connection and try again.');
      }
      html5QrCode = new Html5Qrcode('scanner');
      await html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 120 } },
        onScanSuccess,
        function(){}
      );
    } catch (err) {
      lookupStatus.textContent = "Couldn't start the scanner: " + (err && err.message ? err.message : err);
      await stopScanner();
    }
  });

  async function stopScanner(){
    if (html5QrCode) {
      try { await html5QrCode.stop(); html5QrCode.clear(); } catch(e){}
    }
    scannerDiv.style.display = 'none';
    scanBtn.textContent = 'Scan Barcode';
  }

  async function onScanSuccess(decodedText){
    await stopScanner();
    lookupStatus.textContent = 'Looking up ' + decodedText + '...';
    clearStockImages();
    try {
      var res = await fetch('/api/lookup?upc=' + encodeURIComponent(decodedText));
      var data = await res.json();
      if (data.found) {
        if (data.title) form.name.value = data.title;
        if (data.brand) form.maker.value = data.brand;
        if (data.description) form.notes.value = data.description;
        if (data.images && data.images.length) addStockImages(data.images);
        updateNameLinks();
        lookupStatus.textContent = 'Found a match — double check the details below.';
      } else if (data.error) {
        lookupStatus.textContent = data.error;
      } else {
        lookupStatus.textContent = "No match found for that barcode — fill in the details manually.";
      }
    } catch (e) {
      lookupStatus.textContent = "Lookup failed — fill in the details manually.";
    }
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    status.className = '';
    status.textContent = 'Saving...';
    var submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      var body = new FormData(form);
      if (photoChoice && photoChoice !== 'own') {
        body.delete('photo');
        body.set('stock_image_url', photoChoice);
      }
      var res = await fetch('/api/bottles', { method: 'POST', body: body });
      var data = await res.json();
      if (res.ok) {
        form.style.display = 'none';
        scanBtn.style.display = 'none';
        identifyBtn.style.display = 'none';
        lookupStatus.textContent = '';
        document.getElementById('successPanel').style.display = 'block';
        setTimeout(function(){ window.location.href = '/#cellar'; }, 1400);
        return;
      } else if (res.status === 401) {
        location.href = '/login.html?next=' + encodeURIComponent('/add.html');
        return;
      } else {
        status.className = 'err';
        status.textContent = data.error || 'Something went wrong.';
      }
    } catch (err) {
      status.className = 'err';
      status.textContent = 'Something went wrong — try again.';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
